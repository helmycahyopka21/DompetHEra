<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dompet Keluarga HEra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-blue-50 text-gray-800 p-4 min-h-screen font-sans flex items-center justify-center">
  
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-blue-100">
    
    <!-- Header Aplikasi (Biru Tua) -->
    <div class="bg-blue-900 p-5 text-center shadow-md">
      <h1 class="text-2xl font-extrabold text-white tracking-wide">Dompet Keluarga HEra</h1>
      <p class="text-blue-200 text-sm mt-1 font-medium">(Helmy & Era)</p>
    </div>

    <div class="p-6 space-y-6">
      <!-- Ringkasan Saldo -->
      <div class="bg-gradient-to-r from-blue-900 to-blue-800 p-5 rounded-xl text-center shadow-lg transform transition hover:scale-105">
        <p class="text-sm text-blue-200 mb-1 font-medium">Total Saldo Saat Ini</p>
        <p id="totalSaldo" class="text-3xl font-extrabold text-white">Rp 0</p>
      </div>

      <!-- Form Transaksi -->
      <form id="formTransaksi" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-blue-900 uppercase tracking-wider mb-1">Pencatat</label>
          <select id="pencatat" class="w-full border-2 border-blue-100 p-2.5 rounded-lg text-sm bg-blue-50 focus:outline-none focus:border-blue-900 focus:ring-1 focus:ring-blue-900 transition-colors" required>
            <option value="Helmy">Helmy</option>
            <option value="Era">Era</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-blue-900 uppercase tracking-wider mb-1">Jenis Transaksi</label>
          <select id="jenis" class="w-full border-2 border-blue-100 p-2.5 rounded-lg text-sm bg-blue-50 focus:outline-none focus:border-blue-900 focus:ring-1 focus:ring-blue-900 transition-colors" required>
            <option value="pengeluaran">Pengeluaran (-)</option>
            <option value="pemasukan">Pemasukan (+)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-blue-900 uppercase tracking-wider mb-1">Nominal (Rp)</label>
          <input type="number" id="nominal" placeholder="Contoh: 50000" class="w-full border-2 border-blue-100 p-2.5 rounded-lg text-sm bg-blue-50 focus:outline-none focus:border-blue-900 focus:ring-1 focus:ring-blue-900 transition-colors" required>
        </div>
        <div>
          <label class="block text-xs font-bold text-blue-900 uppercase tracking-wider mb-1">Keterangan</label>
          <input type="text" id="keterangan" placeholder="Contoh: Beli pulsa / Gaji bulanan" class="w-full border-2 border-blue-100 p-2.5 rounded-lg text-sm bg-blue-50 focus:outline-none focus:border-blue-900 focus:ring-1 focus:ring-blue-900 transition-colors" required>
        </div>
        <button type="submit" class="w-full bg-blue-900 text-white font-bold py-3 rounded-lg text-sm hover:bg-blue-950 transition-colors shadow-md">
          SIMPAN TRANSAKSI
        </button>
      </form>

      <!-- Riwayat Transaksi -->
      <div class="pt-4 border-t border-gray-200">
        <h2 class="text-sm font-bold text-blue-900 mb-3 uppercase tracking-wider">Riwayat Transaksi</h2>
        <ul id="daftarTransaksi" class="space-y-3 max-h-60 overflow-y-auto text-sm pr-2">
          <li class="text-center text-gray-400 py-4 font-medium">Memuat data...</li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    // 1. TEMPELKAN KODE KONFIGURASI FIREBASE ANDA DI SINI NANTI
    const firebaseConfig = {
      apiKey: "PASTE_API_KEY_ANDA_DI_SINI",
      authDomain: "PROJECT_ANDA.firebaseapp.com",
      databaseURL: "https://PROJECT_ANDA-default-rtdb.firebaseio.com",
      projectId: "PROJECT_ANDA",
      storageBucket: "PROJECT_ANDA.appspot.com",
      messagingSenderId: "SENDER_ID_ANDA",
      appId: "APP_ID_ANDA"
    };

    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const transRef = db.ref("transaksi_hera"); // Nama referensi database juga disesuaikan

    // Simpan Transaksi ke Firebase
    document.getElementById("formTransaksi").addEventListener("submit", (e) => {
      e.preventDefault();
      const pencatat = document.getElementById("pencatat").value;
      const jenis = document.getElementById("jenis").value;
      const nominal = parseInt(document.getElementById("nominal").value);
      const keterangan = document.getElementById("keterangan").value;

      // Ambil waktu saat ini
      const sekarang = new Date();
      const opsiWaktu = { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' };
      const waktuFormat = sekarang.toLocaleDateString("id-ID", opsiWaktu);

      transRef.push({
        pencatat: pencatat,
        jenis: jenis,
        nominal: nominal,
        keterangan: keterangan,
        waktu: waktuFormat
      });

      // Kosongkan form setelah tersimpan (kecuali nama pencatat)
      document.getElementById("nominal").value = "";
      document.getElementById("keterangan").value = "";
    });

    // Baca Data Real-Time
    transRef.on("value", (snapshot) => {
      const data = snapshot.val();
      const daftarElement = document.getElementById("daftarTransaksi");
      daftarElement.innerHTML = "";

      let saldo = 0;

      if (!data) {
        daftarElement.innerHTML = '<li class="text-center text-gray-400 py-4 font-medium">Belum ada transaksi</li>';
        document.getElementById("totalSaldo").textContent = "Rp 0";
        return;
      }

      // Membalik urutan agar yang terbaru ada di atas
      Object.keys(data).reverse().forEach((key) => {
        const item = data[key];
        const isPemasukan = item.jenis === "pemasukan";
        
        if (isPemasukan) {
          saldo += item.nominal;
        } else {
          saldo -= item.nominal;
        }

        const li = document.createElement("li");
        // Desain list riwayat (hijau untuk masuk, merah untuk keluar)
        li.className = `p-3 rounded-lg border-l-4 flex justify-between items-center shadow-sm ${
          isPemasukan ? "border-green-500 bg-green-50" : "border-red-500 bg-red-50"
        }`;
        
        li.innerHTML = `
          <div>
            <p class="font-bold text-gray-800">${item.keterangan}</p>
            <p class="text-[11px] text-gray-500 mt-0.5 font-medium">
              <span class="${item.pencatat === 'Helmy' ? 'text-blue-700' : 'text-pink-600'}">${item.pencatat}</span> 
              • ${item.waktu}
            </p>
          </div>
          <span class="font-extrabold ${isPemasukan ? "text-green-600" : "text-red-600"}">
            ${isPemasukan ? "+" : "-"} Rp ${item.nominal.toLocaleString("id-ID")}
          </span>
        `;
        daftarElement.appendChild(li);
      });

      document.getElementById("totalSaldo").textContent = `Rp ${saldo.toLocaleString("id-ID")}`;
    });
  </script>
</body>
</html>
