<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dompet Keluarga HEra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-blue-50 text-gray-800 min-h-screen font-sans flex items-center justify-center p-4">

  <!-- ================= HALAMAN LOGIN ================= -->
  <div id="halamanLogin" class="w-full max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden border border-blue-100 p-8 text-center transition-all duration-300">
    <div class="mb-6">
      <h1 class="text-3xl font-extrabold text-blue-900 tracking-wide mb-2">HEra</h1>
      <p class="text-gray-500 text-sm">Catatan Keuangan Keluarga</p>
    </div>
    
    <form id="formLogin" class="space-y-4">
      <div>
        <input type="password" id="passwordInput" placeholder="Masukkan PIN / Password" class="w-full border-2 border-blue-100 p-3 rounded-lg text-center font-bold text-blue-900 focus:outline-none focus:border-blue-900 focus:ring-1 focus:ring-blue-900 transition-colors" required>
      </div>
      <button type="submit" class="w-full bg-blue-900 text-white font-bold py-3 rounded-lg text-sm hover:bg-blue-950 transition-colors shadow-md">
        BUKA DOMPET
      </button>
      <p id="pesanError" class="text-red-500 text-xs mt-2 hidden">Password salah! Silakan coba lagi.</p>
    </form>
  </div>


  <!-- ================= HALAMAN UTAMA APLIKASI ================= -->
  <div id="halamanUtama" class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-blue-100 hidden transition-all duration-300">
    
    <!-- Header Aplikasi -->
    <div class="bg-blue-900 p-5 flex justify-between items-center shadow-md">
      <div>
        <h1 class="text-xl font-extrabold text-white tracking-wide">Dompet HEra</h1>
        <p class="text-blue-200 text-xs mt-1 font-medium">(Helmy & Era)</p>
      </div>
      <button onclick="logout()" class="text-xs bg-red-500 text-white px-3 py-1.5 rounded hover:bg-red-600 font-bold">Keluar</button>
    </div>

    <div class="p-6 space-y-6">
      
      <!-- Ringkasan Saldo Utama -->
      <div class="bg-gradient-to-r from-blue-900 to-blue-800 p-5 rounded-xl text-center shadow-lg">
        <p class="text-sm text-blue-200 mb-1 font-medium">Total Saldo Saat Ini</p>
        <p id="totalSaldo" class="text-3xl font-extrabold text-white">Rp 0</p>
      </div>

      <!-- Rekap Harian (Hari Ini) -->
      <div class="flex gap-4">
        <div class="flex-1 bg-green-50 border border-green-100 p-3 rounded-lg text-center">
          <p class="text-[10px] font-bold text-green-700 uppercase">Masuk Hari Ini</p>
          <p id="masukHariIni" class="text-sm font-extrabold text-green-600 mt-1">Rp 0</p>
        </div>
        <div class="flex-1 bg-red-50 border border-red-100 p-3 rounded-lg text-center">
          <p class="text-[10px] font-bold text-red-700 uppercase">Keluar Hari Ini</p>
          <p id="keluarHariIni" class="text-sm font-extrabold text-red-600 mt-1">Rp 0</p>
        </div>
      </div>

      <!-- Form Transaksi -->
      <form id="formTransaksi" class="space-y-4">
        <div class="flex gap-3">
          <div class="flex-1">
            <label class="block text-xs font-bold text-blue-900 uppercase tracking-wider mb-1">Pencatat</label>
            <select id="pencatat" class="w-full border-2 border-blue-100 p-2.5 rounded-lg text-sm bg-blue-50 focus:outline-none focus:border-blue-900" required>
              <option value="Helmy">Helmy</option>
              <option value="Era">Era</option>
            </select>
          </div>
          <div class="flex-1">
            <label class="block text-xs font-bold text-blue-900 uppercase tracking-wider mb-1">Jenis</label>
            <select id="jenis" class="w-full border-2 border-blue-100 p-2.5 rounded-lg text-sm bg-blue-50 focus:outline-none focus:border-blue-900" required>
              <option value="pengeluaran">Keluar (-)</option>
              <option value="pemasukan">Masuk (+)</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-blue-900 uppercase tracking-wider mb-1">Nominal (Rp)</label>
          <input type="number" id="nominal" placeholder="Contoh: 50000" class="w-full border-2 border-blue-100 p-2.5 rounded-lg text-sm bg-blue-50 focus:outline-none focus:border-blue-900" required>
        </div>
        <div>
          <label class="block text-xs font-bold text-blue-900 uppercase tracking-wider mb-1">Keterangan</label>
          <input type="text" id="keterangan" placeholder="Contoh: Beli token listrik" class="w-full border-2 border-blue-100 p-2.5 rounded-lg text-sm bg-blue-50 focus:outline-none focus:border-blue-900" required>
        </div>
        <button type="submit" class="w-full bg-blue-900 text-white font-bold py-3 rounded-lg text-sm hover:bg-blue-950 transition-colors shadow-md">
          SIMPAN TRANSAKSI
        </button>
      </form>

      <!-- Riwayat Transaksi -->
      <div class="pt-4 border-t border-gray-200">
        <h2 class="text-sm font-bold text-blue-900 mb-3 uppercase tracking-wider">Riwayat Transaksi</h2>
        <ul id="daftarTransaksi" class="space-y-3 max-h-60 overflow-y-auto text-sm pr-2">
          <li class="text-center text-gray-400 py-4 font-medium">Memuat data...</li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    // ================= PENGATURAN PASSWORD =================
    // GANTI "hera123" dengan password yang Anda inginkan
    const KATA_SANDI_APP = "hera123"; 

    // Logika Login
    document.getElementById("formLogin").addEventListener("submit", function(e) {
      e.preventDefault();
      const inputPass = document.getElementById("passwordInput").value;
      
      if(inputPass === KATA_SANDI_APP) {
        document.getElementById("halamanLogin").classList.add("hidden");
        document.getElementById("halamanUtama").classList.remove("hidden");
        document.getElementById("passwordInput").value = ""; // bersihkan input
        document.getElementById("pesanError").classList.add("hidden");
      } else {
        document.getElementById("pesanError").classList.remove("hidden");
      }
    });

    // Logika Logout
    function logout() {
      document.getElementById("halamanUtama").classList.add("hidden");
      document.getElementById("halamanLogin").classList.remove("hidden");
    }

    // ================= KONFIGURASI FIREBASE =================
    // TEMPELKAN KODE KONFIGURASI FIREBASE ANDA DI SINI
    const firebaseConfig = {
      apiKey: "PASTE_API_KEY_ANDA_DI_SINI",
      authDomain: "PROJECT_ANDA.firebaseapp.com",
      databaseURL: "https://PROJECT_ANDA-default-rtdb.firebaseio.com",
      projectId: "PROJECT_ANDA",
      storageBucket: "PROJECT_ANDA.appspot.com",
      messagingSenderId: "SENDER_ID_ANDA",
      appId: "APP_ID_ANDA"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const transRef = db.ref("transaksi_hera");

    // Simpan Transaksi ke Firebase
    document.getElementById("formTransaksi").addEventListener("submit", (e) => {
      e.preventDefault();
      const pencatat = document.getElementById("pencatat").value;
      const jenis = document.getElementById("jenis").value;
      const nominal = parseInt(document.getElementById("nominal").value);
      const keterangan = document.getElementById("keterangan").value;

      const sekarang = new Date();
      const opsiTanggal = { day: '2-digit', month: 'short', year: 'numeric' };
      const tanggalFormat = sekarang.toLocaleDateString("id-ID", opsiTanggal);
      const opsiWaktu = { hour: '2-digit', minute: '2-digit' };
      const jamFormat = sekarang.toLocaleTimeString("id-ID", opsiWaktu);

      // Format disimpan: "14 Okt 2026, 22:30"
      transRef.push({
        pencatat: pencatat,
        jenis: jenis,
        nominal: nominal,
        keterangan: keterangan,
        waktu: `${tanggalFormat}, ${jamFormat}`,
        tanggalReal: tanggalFormat // Disimpan terpisah untuk memudahkan filter rekap harian
      });

      document.getElementById("nominal").value = "";
      document.getElementById("keterangan").value = "";
    });

    // Baca Data Real-Time & Hitung Rekap
    transRef.on("value", (snapshot) => {
      const data = snapshot.val();
      const daftarElement = document.getElementById("daftarTransaksi");
      daftarElement.innerHTML = "";

      let saldoUtama = 0;
      let totalMasukHariIni = 0;
      let totalKeluarHariIni = 0;

      // Ambil tanggal hari ini di perangkat untuk perbandingan rekap
      const tanggalHariIni = new Date().toLocaleDateString("id-ID", { day: '2-digit', month: 'short', year: 'numeric' });

      if (!data) {
        daftarElement.innerHTML = '<li class="text-center text-gray-400 py-4 font-medium">Belum ada transaksi</li>';
        document.getElementById("totalSaldo").textContent = "Rp 0";
        return;
      }

      Object.keys(data).reverse().forEach((key) => {
        const item = data[key];
        const isPemasukan = item.jenis === "pemasukan";
        
        // 1. Hitung Saldo Utama
        if (isPemasukan) saldoUtama += item.nominal;
        else saldoUtama -= item.nominal;

        // 2. Hitung Rekap Hari Ini
        // Menggunakan tanggalReal (untuk data baru) atau memotong string waktu (untuk kompatibilitas data lama)
        const tanggalItem = item.tanggalReal || item.waktu.split(",")[0].trim();
        if (tanggalItem === tanggalHariIni) {
          if (isPemasukan) totalMasukHariIni += item.nominal;
          else totalKeluarHariIni += item.nominal;
        }

        // 3. Tampilkan Riwayat
        const li = document.createElement("li");
        li.className = `p-3 rounded-lg border-l-4 flex justify-between items-center shadow-sm ${
          isPemasukan ? "border-green-500 bg-green-50" : "border-red-500 bg-red-50"
        }`;
        
        li.innerHTML = `
          <div>
            <p class="font-bold text-gray-800">${item.keterangan}</p>
            <p class="text-[11px] text-gray-500 mt-0.5 font-medium">
              <span class="${item.pencatat === 'Helmy' ? 'text-blue-700' : 'text-pink-600'}">${item.pencatat}</span> 
              • ${item.waktu}
            </p>
          </div>
          <span class="font-extrabold ${isPemasukan ? "text-green-600" : "text-red-600"}">
            ${isPemasukan ? "+" : "-"} Rp ${item.nominal.toLocaleString("id-ID")}
          </span>
        `;
        daftarElement.appendChild(li);
      });

      // Update Angka di Layar
      document.getElementById("totalSaldo").textContent = `Rp ${saldoUtama.toLocaleString("id-ID")}`;
      document.getElementById("masukHariIni").textContent = `Rp ${totalMasukHariIni.toLocaleString("id-ID")}`;
      document.getElementById("keluarHariIni").textContent = `Rp ${totalKeluarHariIni.toLocaleString("id-ID")}`;
    });
  </script>
</body>
</html>
